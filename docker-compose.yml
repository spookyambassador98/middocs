services:
  postgres:
    image: postgres:16-alpine
    container_name: mgd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mgd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mgd_password}
      POSTGRES_DB: ${POSTGRES_DB:-mini_google_docs}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mgd}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [mgd-net]

  redis:
    image: redis:7-alpine
    container_name: mgd-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [mgd-net]

  # Two backend instances behind nginx to demonstrate horizontal scaling:
  # Socket.io state is shared across them via the Redis adapter (pub/sub),
  # and Yjs document state is persisted to Postgres so either instance can
  # serve any client.
  backend-1:
    build:
      context: ./backend
    container_name: mgd-backend-1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      INSTANCE_ID: backend-1
      DATABASE_URL: postgres://${POSTGRES_USER:-mgd}:${POSTGRES_PASSWORD:-mgd_password}@postgres:5432/${POSTGRES_DB:-mini_google_docs}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_super_secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [mgd-net]

  backend-2:
    build:
      context: ./backend
    container_name: mgd-backend-2
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      INSTANCE_ID: backend-2
      DATABASE_URL: postgres://${POSTGRES_USER:-mgd}:${POSTGRES_PASSWORD:-mgd_password}@postgres:5432/${POSTGRES_DB:-mini_google_docs}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_super_secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [mgd-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: mgd-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
    networks: [mgd-net]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8081}
    container_name: mgd-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - nginx
    networks: [mgd-net]

networks:
  mgd-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
