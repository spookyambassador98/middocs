worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # ip_hash gives each client a sticky backend instance. This is required
  # for Engine.IO's HTTP long-polling handshake (a session's polling
  # requests must all land on the same process); once a client upgrades to
  # a WebSocket the connection stays pinned to whichever instance accepted
  # the upgrade anyway. Cross-instance consistency (so a doc room's clients
  # on backend-1 see events from clients on backend-2) is handled
  # separately by the Redis Socket.io adapter, not by this load balancer.
  upstream backend_pool {
    ip_hash;
    server backend-1:4000;
    server backend-2:4000;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Instance $upstream_addr;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }
  }
}
